<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Blonda">
<meta name="description" content="Reservá tu mesa en La Blonda Resto Bar">
<link rel="manifest" href="/manifest.json">
<title>La Blonda — Reservas</title>
<style>
:root{
  --bg:#0D0D0D;--surf:#1A1A1A;--surf2:#222;--bdr:#333;--bdr2:#444;
  --tx:#F5F0E8;--tx2:#B8B0A0;--tx3:#6B6558;
  --gold:#C8960C;--gold2:#E8B020;--gold-bg:rgba(200,150,12,.12);
  --grn:#25A244;--grn-bg:rgba(37,162,68,.15);
  --red:#C0392B;--red-bg:rgba(192,57,43,.15);
  --r:12px;--rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

/* HERO */
.hero{background:linear-gradient(180deg,#0D0D0D 0%,#1a1208 50%,#0D0D0D 100%);padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(200,150,12,.08) 0%,transparent 70%)}
.logo-wrap{position:relative;display:inline-block;margin-bottom:1.25rem}
.logo-img{width:140px;height:140px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 30px rgba(200,150,12,.25),0 0 60px rgba(200,150,12,.1);object-fit:cover}
.hero-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);margin-bottom:.375rem}
.hero-sub{font-size:12px;color:var(--tx3);letter-spacing:.08em}

/* EVENTO ACTIVO */
.evento-banner{margin:0 1rem 1rem;background:var(--surf);border:1px solid var(--gold);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s}
.evento-banner:hover{transform:translateY(-2px)}
.evento-banner-img{height:120px;background:linear-gradient(135deg,#1a0f00,#3d2400);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden}
.evento-banner-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.evento-banner-body{padding:.875rem 1rem}
.evento-banner-badge{display:inline-block;background:var(--gold-bg);border:1px solid var(--gold);color:var(--gold2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 9px;border-radius:20px;margin-bottom:5px}
.evento-banner-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:3px}
.evento-banner-meta{font-size:12px;color:var(--tx2)}
.evento-banner-btn{width:100%;background:var(--gold);color:#000;border:none;padding:10px;border-radius:var(--rsm);font-size:14px;font-weight:700;cursor:pointer;margin-top:.75rem}
.evento-banner-btn:hover{background:var(--gold2)}

/* CHAT */
.chat-section{margin:0 1rem 1rem}
.chat-container{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;height:520px}
.chat-hdr{background:var(--surf2);border-bottom:1px solid var(--bdr);padding:.875rem 1rem;display:flex;align-items:center;gap:10px}
.chat-hdr-av{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1px solid var(--gold);flex-shrink:0}
.chat-hdr-av img{width:100%;height:100%;object-fit:cover}
.chat-hdr-name{font-weight:700;font-size:14px;color:var(--tx)}
.chat-hdr-st{font-size:11px;color:var(--grn);margin-top:1px;display:flex;align-items:center;gap:4px}
.chat-hdr-st::before{content:'';width:6px;height:6px;background:var(--grn);border-radius:50%;display:inline-block}
.chat-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-track{background:transparent}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.burbuja{max-width:85%;padding:.75rem 1rem;border-radius:12px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.bot{background:var(--surf);border:1px solid var(--bdr);color:var(--tx);align-self:flex-start;border-radius:4px 12px 12px 12px}
.usr{background:var(--gold);color:#000;align-self:flex-end;border-radius:12px 4px 12px 12px;font-weight:500}
.bot-nm{font-size:10px;color:var(--gold);font-weight:700;margin-bottom:4px;letter-spacing:.04em}
.typing{display:flex;gap:5px;align-items:center;padding:.5rem .625rem}
.dot{width:7px;height:7px;background:var(--tx3);border-radius:50%;animation:bounce .8s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
.chat-inp-area{background:var(--surf2);border-top:1px solid var(--bdr);padding:.75rem 1rem;display:flex;gap:8px;align-items:flex-end}
.chat-inp{flex:1;background:var(--bg);border:1px solid var(--bdr);border-radius:20px;padding:9px 14px;font-size:14px;font-family:inherit;resize:none;color:var(--tx);line-height:1.4;max-height:100px}
.chat-inp:focus{outline:none;border-color:var(--gold)}
.chat-inp::placeholder{color:var(--tx3)}
.btn-send{background:var(--gold);color:#000;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;transition:background .15s}
.btn-send:hover{background:var(--gold2)}

/* CONFIRM */
.confirm-card{background:var(--grn-bg);border:1px solid var(--grn);border-radius:var(--rsm);padding:.875rem;margin-top:.625rem}
.confirm-t{font-size:13px;font-weight:700;color:var(--grn);margin-bottom:.375rem}
.confirm-d{font-size:12px;color:var(--tx2);line-height:1.6}
.btn-wa-c{background:#25D366;color:#fff;border:none;padding:9px 14px;border-radius:var(--rsm);cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-top:.625rem;width:100%;justify-content:center}

/* QUICK BTNS */
.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.qbtn{background:var(--surf2);border:1px solid var(--bdr2);color:var(--tx2);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;transition:all .15s;white-space:nowrap}
.qbtn:hover{border-color:var(--gold);color:var(--gold)}

/* INFO BAR */
.info-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 1rem 1rem}
.info-item{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:.875rem;text-align:center}
.info-icon{font-size:20px;margin-bottom:4px}
.info-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.info-val{font-size:12px;color:var(--tx2);margin-top:2px}

/* FOOTER */
.footer{text-align:center;padding:1.5rem 1rem;color:var(--tx3);font-size:11px;border-top:1px solid var(--bdr);margin:0 1rem}
.footer strong{color:var(--gold)}

/* POPUP */
.popup-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-end;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.popup-wrap.open{display:flex;animation:fadeUp .3s ease}
.popup{background:var(--surf);border-radius:18px 18px 12px 12px;width:100%;max-width:480px;overflow:hidden;box-shadow:0 -4px 40px rgba(0,0,0,.4);border:1px solid var(--bdr)}
.popup-img{height:180px;background:linear-gradient(135deg,#1a0f00,#3d2400);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;overflow:hidden}
.popup-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.popup-overlay-text{position:relative;z-index:1;text-align:center;padding:1rem}
.popup-body{padding:1.25rem}
.popup-badge{display:inline-block;background:var(--gold-bg);border:1px solid var(--gold);color:var(--gold2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 10px;border-radius:20px;margin-bottom:6px}
.popup-title{font-size:20px;font-weight:800;color:var(--tx);margin-bottom:4px;line-height:1.2}
.popup-desc{font-size:13px;color:var(--tx2);line-height:1.55;margin-bottom:.875rem}
.popup-meta{font-size:12px;color:var(--tx3);margin-bottom:.875rem}
.popup-footer{display:flex;gap:7px}
.popup-btn{flex:1;background:var(--gold);color:#000;border:none;padding:12px;border-radius:var(--rsm);cursor:pointer;font-size:15px;font-weight:800}
.popup-btn:hover{background:var(--gold2)}
.popup-cls{background:none;border:1px solid var(--bdr2);padding:12px 16px;border-radius:var(--rsm);cursor:pointer;font-size:14px;color:var(--tx2)}

@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<div class="footer">
  <strong>La Blonda Resto Bar</strong><br>
  <span id="footer-ig"></span>
</div>

<!-- POPUP EVENTO -->
<div id="popup-wrap" class="popup-wrap" onclick="if(event.target===this)cerrarPopup()">
  <div class="popup">
    <div class="popup-img" id="p-img"><div id="p-emoji" style="position:relative;z-index:1">🎭</div></div>
    <div class="popup-body">
      <div class="popup-badge" id="p-badge">Evento especial</div>
      <div class="popup-title" id="p-title"></div>
      <div class="popup-desc" id="p-desc"></div>
      <div class="popup-meta" id="p-meta"></div>
      <div class="popup-footer">
        <button class="popup-btn" onclick="popupReservar()">🍺 Reservar ahora</button>
        <button class="popup-cls" onclick="cerrarPopup()">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script>
const KEY_CFG = 'lablonda_admin_v1';
const KEY_RES = 'lablonda_v3';
let cfg = {}, chatHist = [], popupEvento = null;

function cargarCfg(){
  try{ cfg = JSON.parse(localStorage.getItem(KEY_CFG)||'{}'); }catch(e){}
}

function init(){
  cargarCfg();
  const bar = cfg.bar||{};
  const barNombre = bar.nombre||'La Blonda';
  document.getElementById('chat-bar-name').textContent = barNombre;
  if(bar.horario) document.getElementById('info-horario').textContent = bar.horario;
  if(bar.dir) document.getElementById('info-dir').textContent = bar.dir;
  if(bar.ig) document.getElementById('footer-ig').textContent = '@'+bar.ig;

  // Mesas libres
  const mesas = cfg.mesas||[];
  try{
    const res = JSON.parse(localStorage.getItem(KEY_RES)||'{}');
    const reservas = res.reservas||[];
    const ocupadas = reservas.filter(r=>r.estado==='ocupada'||r.estado==='reservada').map(r=>r.mesa);
    const libres = mesas.filter(m=>!ocupadas.includes(m.num)).length;
    document.getElementById('info-mesas').textContent = libres + ' libres';
  }catch(e){ document.getElementById('info-mesas').textContent = mesas.length + ' mesas'; }

  // Evento activo
  const activos = (cfg.eventos||[]).filter(e=>e.activo);
  if(activos.length){
    mostrarEventoBanner(activos[0]);
    setTimeout(()=>mostrarPopup(activos[0]), 6000);
  }

  initChat(barNombre);
}

// EVENTO BANNER
function mostrarEventoBanner(ev){
  const TIPOS={show:'🎸 Show en vivo',karaoke:'🎤 Karaoke',tematica:'🌙 Noche temática',dj:'🎧 DJ',standup:'🎭 Stand up',deporte:'📺 Deportes',promo:'🍺 Promo',otro:'⭐ Evento'};
  const wrap = document.getElementById('evento-wrap');
  const[y,m,d]=(ev.fecha||'').split('-');
  const meta = [];
  if(ev.fecha) meta.push('📅 '+d+'/'+m+'/'+y);
  if(ev.hora) meta.push('🕐 '+ev.hora+' hs');
  if(ev.precio>0) meta.push('💵 $'+Number(ev.precio).toLocaleString('es-AR'));
  else meta.push('🎉 Entrada libre');
  wrap.style.display='block';
  wrap.innerHTML=`<div class="evento-banner" onclick="enviarRapido('Quiero reservar para el evento ${ev.nombre}')">
    <div class="evento-banner-img">${ev.img?`<img src="${ev.img}" alt="${ev.nombre}"/>`:''}
      <div style="position:relative;z-index:1;font-size:48px">${ev.img?'':ev.emoji||'🎭'}</div>
    </div>
    <div class="evento-banner-body">
      <div class="evento-banner-badge">${TIPOS[ev.tipo]||'Evento especial'}</div>
      <div class="evento-banner-title">${ev.nombre}</div>
      <div class="evento-banner-meta">${meta.join(' · ')}</div>
      <button class="evento-banner-btn">🍺 Reservar para este evento</button>
    </div>
  </div>`;
}

// POPUP
function mostrarPopup(ev){
  const TIPOS={show:'🎸 Show en vivo',karaoke:'🎤 Karaoke',tematica:'🌙 Noche temática',dj:'🎧 DJ',standup:'🎭 Stand up',deporte:'📺 Deportes',promo:'🍺 Promo',otro:'⭐ Evento'};
  popupEvento=ev;
  document.getElementById('p-badge').textContent=TIPOS[ev.tipo]||'Evento especial';
  document.getElementById('p-title').textContent=ev.nombre;
  document.getElementById('p-desc').textContent=ev.desc||'';
  document.getElementById('p-emoji').textContent=ev.emoji||'🎭';
  const img=document.getElementById('p-img');
  const ei=img.querySelector('img');if(ei)ei.remove();
  if(ev.img){const i=document.createElement('img');i.src=ev.img;i.alt=ev.nombre;i.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';img.appendChild(i);}
  const[y,m,d]=(ev.fecha||'').split('-');
  const meta=[];
  if(ev.fecha)meta.push('📅 '+d+'/'+m+'/'+y);
  if(ev.hora)meta.push('🕐 '+ev.hora+' hs');
  if(ev.precio>0)meta.push('💵 $'+Number(ev.precio).toLocaleString('es-AR'));
  else meta.push('🎉 Entrada libre');
  document.getElementById('p-meta').textContent=meta.join(' · ');
  document.getElementById('popup-wrap').classList.add('open');
}
function cerrarPopup(){document.getElementById('popup-wrap').classList.remove('open');}
function popupReservar(){
  cerrarPopup();
  if(popupEvento) enviarRapido('Quiero reservar para el evento '+popupEvento.nombre);
}

// CHAT
function initChat(barNombre){
  document.getElementById('chat-msgs').innerHTML='';
  chatHist=[];
  const activos=eventosDB.length>0?eventosDB:(cfg.eventos||[]).filter(e=>e.activo);
  const eventoMsg = activos.length ? `\n\n🎭 Esta semana: *${activos[0].nombre}* — no te lo pierdas.` : '';
  chatMsg(`¡Hola! 👋 Bienvenido a *${barNombre}*.${eventoMsg}\n\n¿En qué te puedo ayudar? Puedo reservarte una mesa, contarte sobre nuestros eventos o darte info del bar. 🍺`, true);
}

function chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatEnviar();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}

function chatMsg(texto, esBot, extra){
  const c=document.getElementById('chat-msgs');
  const d=document.createElement('div');d.className='burbuja '+(esBot?'bot':'usr');
  if(esBot){const n=document.createElement('div');n.className='bot-nm';n.textContent=(cfg.bar?.nombre||'La Blonda').toUpperCase();d.appendChild(n);}
  const p=document.createElement('p');p.style.margin='0';p.textContent=texto;d.appendChild(p);
  if(extra)d.appendChild(extra);
  c.appendChild(d);c.scrollTop=c.scrollHeight;
  // Ocultar quick btns después del primer mensaje del usuario
  if(!esBot) document.getElementById('quick-btns').style.display='none';
}

function chatTyping(){
  const c=document.getElementById('chat-msgs');
  const d=document.createElement('div');d.className='burbuja bot';d.id='typing';
  d.innerHTML=`<div class="bot-nm">${(cfg.bar?.nombre||'La Blonda').toUpperCase()}</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function enviarRapido(txt){
  document.getElementById('chat-inp').value=txt;
  chatEnviar();
}

async function chatEnviar(){
  const inp=document.getElementById('chat-inp');
  const txt=inp.value.trim();if(!txt)return;
  inp.value='';inp.style.height='auto';
  chatMsg(txt,false);
  chatHist.push({role:'user',content:txt});
  chatTyping();
  try{
    const activos=eventosDB.length>0?eventosDB:(cfg.eventos||[]).filter(e=>e.activo);
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:chatHist,cfg,eventoActual:activos[0]||eventosDB[0]||null,eventos:eventosDB})
    });
    const data=await res.json();
    document.getElementById('typing')?.remove();
    chatHist.push({role:'assistant',content:data.texto});
    if(data.accion?.ACCION==='RESERVAR'){
      const a=data.accion;
      // Guardar reserva
      try{
        const stored=JSON.parse(localStorage.getItem(KEY_RES)||'{}');
        const reservas=stored.reservas||[];
        const nid=stored.nid||1;
        reservas.push({id:nid,nombre:a.nombre,tel:a.telefono||'',fecha:a.fecha,hora:a.hora,
          mesa:a.mesa,pax:a.personas,operador:'Chat web',notas:a.evento||'',estado:'reservada'});
        localStorage.setItem(KEY_RES,JSON.stringify({...stored,reservas,nid:nid+1}));
      }catch(e){}
      // Card de confirmación
      const extra=document.createElement('div');
      extra.className='confirm-card';
      const[y,m,d]=(a.fecha||'').split('-');
      extra.innerHTML=`<div class="confirm-t">✅ ¡Reserva confirmada!</div>
        <div class="confirm-d">👤 ${a.nombre}<br>📅 ${d||'?'}/${m||'?'}/${y||'?'} — ${a.hora||'?'} hs<br>🪑 Mesa ${a.mesa} · ${a.personas} personas${a.evento?'<br>🎭 '+a.evento:''}</div>`;
      const barTel=(cfg.bar?.tel||'').replace(/\D/g,'');
      if(barTel){
        const msg=`¡Hola! Reservé una mesa en La Blonda 🍺\n\n📅 ${d}/${m}/${y} — ${a.hora} hs\n🪑 Mesa ${a.mesa} · ${a.personas} personas\n👤 ${a.nombre}${a.evento?'\n🎭 '+a.evento:''}`;
        const num=barTel.startsWith('54')?barTel:'54'+barTel;
        const btn=document.createElement('button');
        btn.className='btn-wa-c';

        btn.onclick=()=>window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`);
        extra.appendChild(btn);
      }
      chatMsg(data.texto,true,extra);
    } else {
      chatMsg(data.texto,true);
    }
  }catch(e){
    document.getElementById('typing')?.remove();
    chatMsg('Ups, hubo un problema de conexión. Intentá de nuevo en un momento. 😅',true);
  }
}


// Eventos cargados desde Supabase
let eventosDB = [];
let sponsorsDB = [];

async function cargarEventosYSponsors(){
  try{
    const [evRes, spRes] = await Promise.all([
      fetch('/api/supabase?tabla=eventos'),
      fetch('/api/supabase?tabla=sponsors')
    ]);
    const evData = await evRes.json();
    const spData = await spRes.json();
    if(Array.isArray(evData)) eventosDB = evData.filter(e=>e.activo);
    if(Array.isArray(spData)) sponsorsDB = spData.filter(s=>s.activo);
    renderSponsorsCarrusel();
    console.log('Eventos cargados:', eventosDB.length, 'Sponsors:', sponsorsDB.length);
  }catch(e){
    console.error('Error cargando datos:', e);
  }
}

function renderSponsorsCarrusel(){
  const section = document.getElementById('sponsors-section');
  const track = document.getElementById('sponsors-track');
  if(!section||!track||!sponsorsDB.length) return;
  const items = [...sponsorsDB, ...sponsorsDB];
  track.innerHTML = items.map(s=>s.img
    ?`<img src="${s.img}" style="width:80px;height:60px;object-fit:contain;filter:grayscale(20%);opacity:.85;flex-shrink:0" alt="${s.nombre}" title="${s.nombre}">`
    :`<div style="width:80px;height:60px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tx3);text-align:center;flex-shrink:0;padding:4px">${s.nombre}</div>`
  ).join('');
  section.style.display='block';
}

init();
cargarEventosYSponsors();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
